# ==========================================================
# profile.renstoolbox.com — nginx site config
# Protections replicated from baizhan.renstoolbox.com plus:
#   - Rate limiting (limit_req zones defined in nginx.conf http block)
#   - HSTS + security response headers
#   - server_tokens off (set in nginx.conf)
# Install:
#   sudo ln -s /etc/nginx/sites-available/profile.renstoolbox.com \
#              /etc/nginx/conf.d/profile.renstoolbox.com.conf
# ==========================================================

# ------------------------------------------------------
# Required zones in nginx.conf (http block) — see
# nginx/nginx.conf.rate-limit.snippet.txt
#   limit_req_zone $binary_remote_addr zone=profile_general:10m rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=profile_auth:10m   rate=10r/m;
# ------------------------------------------------------

# ==========================================================
# HTTP (80) – ACME + redirect everything to HTTPS
# ==========================================================
server {
    listen 80;
    server_name profile.renstoolbox.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }

    return 301 https://profile.renstoolbox.com$request_uri;
}

# ==========================================================
# HTTPS (443) – MAIN Profile application
# ==========================================================
server {
    listen 443 ssl http2;
    server_name profile.renstoolbox.com;

    ssl_certificate     /etc/letsencrypt/live/profile.renstoolbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profile.renstoolbox.com/privkey.pem;

    client_max_body_size 20M;

    # ------------------------------------------------------
    # Rate limiting (zones defined in nginx.conf)
    # ------------------------------------------------------
    limit_req zone=profile_general burst=40 nodelay;

    # ------------------------------------------------------
    # Security response headers
    # ------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------
    # HARD BLOCK common exploit / scanner paths
    # ------------------------------------------------------
    location ~* ^/(exec|cmd|shell|cgi-bin|phpmyadmin|pma|wp-admin|wp-login\.php|vendor|\.env) {
        return 444;
    }

    # ------------------------------------------------------
    # NEXT.JS DEV HMR (lockdown to dev IP)
    # ------------------------------------------------------
    location /_next/webpack-hmr {
        allow 24.205.14.100;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ------------------------------------------------------
    # QUERY STRING SECURITY FILTER
    # ------------------------------------------------------
    if ($query_string ~* "(child_process|exec\(|spawn\(|base64|curl\s|wget\s|/proc/self|/etc/passwd|id_rsa|id_ed25519|\.aws|\.ssh|\.env)") {
        return 403;
    }

    # ------------------------------------------------------
    # Compression
    # ------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        application/xml+rss
        font/ttf
        font/otf
        image/svg+xml;

    # ------------------------------------------------------
    # Next.js static assets (immutable cache)
    # ------------------------------------------------------
    location /_next/static/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------
    # API backend
    # ------------------------------------------------------
    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ------------------------------------------------------
    # Auth endpoints — stricter rate limit (brute-force)
    # ------------------------------------------------------
    location /api/auth {
        limit_req zone=profile_auth burst=10 nodelay;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ------------------------------------------------------
    # Main frontend
    # ------------------------------------------------------
    location / {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
